# Bonddy Platform - API + PostgreSQL (production / VPS)
# Run from the repo root: cp .env.example .env && docker compose up -d --build
# Payment/SMTP/Firebase keys are optional for local runs; those features are disabled until set.

services:
  postgres:
    image: postgres:16-alpine
    container_name: bonddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-BonddyPlatformDb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-BonddyPlatformDb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: BonddyPlatform.API/Dockerfile
    container_name: bonddy-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ENABLE_SWAGGER: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-BonddyPlatformDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Jwt__Issuer: ${JWT_ISSUER:-BonddyPlatform}
      Jwt__Audience: ${JWT_AUDIENCE:-BonddyPlatform}
      Jwt__AccessTokenExpiryMinutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-60}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-}
      PAYPAL_CANCEL_URL: ${PAYPAL_CANCEL_URL:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-https://bonddy.vn/payment/payos/success}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-https://bonddy.vn/payment/payos/cancel}
    ports:
      - "8080:8080" # Nginx proxies 80/443 -> 8080 in production

volumes:
  postgres_data:
